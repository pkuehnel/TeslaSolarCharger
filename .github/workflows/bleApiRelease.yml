name: bleApiRelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag to publish'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - edge

jobs:
  build-and-push-bleapi:
    name: Building BLE API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push BLE API
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./TeslaSolarCharger.BleApi/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/teslasolarchargerbleapi:${{ github.event.inputs.tag }}
